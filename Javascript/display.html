<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Page</title>
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background: #f4f4f4;
}

/* Search Bar */

.searchbar{
    width: 100%;
    height: 70px;
    background: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    position: sticky;
    top: 0;
    z-index: 100;
}

.search{
    width: 70%;
}

.search input{
    width: 100%;
    padding: 12px 15px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
    outline: none;
}

.search input:focus{
    border: 1px solid royalblue;
}

select{
    padding: 10px 15px;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

/* Sidebar */

.layout{
    position: fixed;
    top: 90px;
    left: 20px;

    width: 200px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,.15);

    display: flex;
    flex-direction: column;
    gap: 12px;
}

.layout label{
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.layout input{
    width: 18px;
    height: 18px;
    cursor: pointer;
}

/* Product Container */

.container{
    margin-left: 240px;
    padding: 30px;

    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
}

/* Product Card */

.card{
    width: 260px;
    height: 350px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 12px rgba(0,0,0,.15);
    transition: .3s;
}

.card:hover{
    transform: translateY(-8px);
}

.card img{
    width: 100%;
    height: 220px;
    object-fit: contain;
    padding: 15px;
}

.info{
    padding: 15px;
}

.para{
    font-size: 16px;
    font-weight: bold;
    height: 45px;
    overflow: hidden;
}

.price{
    color: green;
    font-size: 22px;
    font-weight: bold;
    margin: 10px 0;
}

.category{
    color: #666;
    font-size: 15px;
}
    </style>
</head>
<body>
    <div class="main">
    <div class="searchbar">
        <div class="search">
            <input oninput="search()" type="text" class="text" placeholder="Enter the values">
        </div>
        <select onchange="priceFilter()">
            <option value="">Sort</option>
            <option value="low">low-high</option>
            <option value="high">high-low</option>
        </select>
    </div>

    <div class="layout" style="display: flex; flex-direction: column; justify-content:start; width: 100px;">
        <label for="men">Men's</label>
        <input onchange="options()" type="checkbox" value="men">
        <label for="women">Women's</label>
        <input onchange="options()" type="checkbox" value="women">
        <label for="electornics">Electronic's</label>
        <input onchange="options()" type="checkbox" value="electronics">
        <label for="electornics">Jwelery</label>
        <input onchange="options()" type="checkbox" value="jewelery">
    </div>

    <div class="container">

    </div>
</div>
    <script src="./display.js"></script>
</body>
</html>
